<script>
/* Supabase shim: gives the page the same window.claude.use('db'|'user'|'room') API
   it uses inside Claude, backed by a free Supabase project.
   Needs: window.SAT_CONFIG = { supabaseUrl, supabaseKey } and supabase-js v2 loaded first. */
(function () {
  var cfg = window.SAT_CONFIG || {};
  if (!window.supabase || !cfg.supabaseUrl || !cfg.supabaseKey || /YOUR-/.test(cfg.supabaseUrl + cfg.supabaseKey)) {
    console.warn('[shim] Supabase is not configured: the page runs on this device only.');
    return;
  }
  var sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
    auth: { persistSession: false },
    realtime: { params: { eventsPerSecond: 20 } }
  });
  var TABLE = 'docs';

  function uid() {
    try {
      var k = 'sat-shim-uid', v = localStorage.getItem(k);
      if (!v) { v = 'u_' + Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem(k, v); }
      return v;
    } catch (e) { return 'u_anon'; }
  }
  function split(path) {
    var p = String(path).split('/').filter(Boolean);
    return { col: p.slice(0, -1).join('/'), id: p[p.length - 1] };
  }
  function err(e) { return { code: (e && e.code) || 'unavailable', message: (e && e.message) || String(e) }; }
  function snapDoc(id, data) { return { id: id, exists: data != null, data: function () { return data == null ? undefined : JSON.parse(JSON.stringify(data)); } }; }
  function val(o, f) { return o ? o[f] : undefined; }

  /* ---- one realtime channel for the whole table, fanned out to listeners ---- */
  var listeners = [], tableChan = null;
  function ensureTableChannel() {
    if (tableChan) return;
    tableChan = sb.channel('docs-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, function (pl) {
        var row = pl.new && pl.new.col != null ? pl.new : pl.old;
        if (!row) return;
        listeners.slice().forEach(function (l) { if (l.col === row.col) l.onChange(pl.eventType, row, pl.new); });
      })
      .subscribe();
  }

  function makeDoc(path) {
    var s = split(path);
    var ref = {
      id: s.id, path: path,
      get: function () {
        return sb.from(TABLE).select('data').eq('col', s.col).eq('id', s.id).maybeSingle().then(function (r) {
          if (r.error) throw err(r.error);
          return snapDoc(s.id, r.data ? r.data.data : null);
        });
      },
      set: function (data) {
        return sb.from(TABLE).upsert({ col: s.col, id: s.id, data: data, updated_at: new Date().toISOString() }).then(function (r) { if (r.error) throw err(r.error); });
      },
      update: function (patch) {
        return ref.get().then(function (d) {
          var cur = d.exists ? d.data() : {};
          Object.keys(patch || {}).forEach(function (k) {
            var v = patch[k];
            if (v && typeof v === 'object' && v.__delete__) delete cur[k]; else cur[k] = v;
          });
          return ref.set(cur);
        });
      },
      delete: function () {
        return sb.from(TABLE).delete().eq('col', s.col).eq('id', s.id).then(function (r) { if (r.error) throw err(r.error); });
      },
      onSnapshot: function (next, onErr) {
        var dead = false, cur = null;
        ref.get().then(function (d) { if (!dead) { cur = d.exists ? d.data() : null; next(snapDoc(s.id, cur)); } }, function (e) { if (onErr) onErr(err(e)); });
        ensureTableChannel();
        var l = { col: s.col, onChange: function (type, row, nw) {
          if (row.id !== s.id || dead) return;
          cur = type === 'DELETE' ? null : (nw ? nw.data : null);
          next(snapDoc(s.id, cur));
        } };
        listeners.push(l);
        return function () { dead = true; listeners = listeners.filter(function (x) { return x !== l; }); };
      },
      collection: function (sub) { return makeCol(path + '/' + sub); }
    };
    return ref;
  }

  function makeQuery(col, ord, lim, wh) {
    function apply(rows) {
      var a = rows.slice();
      (wh || []).forEach(function (w) {
        a = a.filter(function (r) {
          var x = val(r.data, w[0]), y = w[2];
          switch (w[1]) {
            case '==': return x === y; case '!=': return x !== y; case '<': return x < y; case '<=': return x <= y;
            case '>': return x > y; case '>=': return x >= y; case 'in': return (y || []).indexOf(x) >= 0;
            case 'not-in': return (y || []).indexOf(x) < 0; case 'array-contains': return Array.isArray(x) && x.indexOf(y) >= 0;
            default: return true;
          }
        });
      });
      if (ord) {
        a.sort(function (p, q) {
          var x = val(p.data, ord.f), y = val(q.data, ord.f);
          if (x === y) return 0; if (x === undefined) return 1; if (y === undefined) return -1;
          return (x < y ? -1 : 1) * (ord.d === 'desc' ? -1 : 1);
        });
      } else a.sort(function (p, q) { return p.id < q.id ? -1 : 1; });
      if (lim) a = a.slice(0, lim);
      return a;
    }
    function snap(rows) {
      var a = apply(rows);
      return { docs: a.map(function (r) { return snapDoc(r.id, r.data); }), size: a.length, empty: !a.length, docChanges: function () { return []; }, forEach: function (f) { a.map(function (r) { return snapDoc(r.id, r.data); }).forEach(f); } };
    }
    function fetchAll() {
      return sb.from(TABLE).select('id,data').eq('col', col).limit(2000).then(function (r) { if (r.error) throw err(r.error); return r.data || []; });
    }
    var q = {
      where: function (f, op, v) { return makeQuery(col, ord, lim, (wh || []).concat([[f, op, v]])); },
      orderBy: function (f, d) { return makeQuery(col, { f: f, d: d || 'asc' }, lim, wh); },
      limit: function (n) { return makeQuery(col, ord, n, wh); },
      get: function () { return fetchAll().then(snap); },
      onSnapshot: function (next, onErr) {
        var dead = false, rows = null, t = 0;
        function emit() { if (!dead && rows) next(snap(rows)); }
        fetchAll().then(function (r) { rows = r; emit(); }, function (e) { if (onErr) onErr(err(e)); });
        ensureTableChannel();
        var l = { col: col, onChange: function (type, row, nw) {
          if (dead || !rows) return;
          rows = rows.filter(function (x) { return x.id !== row.id; });
          if (type !== 'DELETE' && nw) rows.push({ id: nw.id, data: nw.data });
          clearTimeout(t); t = setTimeout(emit, 30);
        } };
        listeners.push(l);
        // safety net: refresh every 60 s in case a realtime event was missed
        var iv = setInterval(function () { fetchAll().then(function (r) { rows = r; emit(); }, function () {}); }, 60000);
        return function () { dead = true; clearInterval(iv); listeners = listeners.filter(function (x) { return x !== l; }); };
      }
    };
    return q;
  }

  function makeCol(col) {
    var q = makeQuery(col, null, 0, null);
    q.path = col;
    q.doc = function (id) { return makeDoc(col + '/' + (id || ('d' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8)))); };
    q.add = function (data) { var d = q.doc(); return d.set(data).then(function () { return d; }); };
    return q;
  }

  var db = { collection: makeCol, doc: makeDoc };

  var me = uid();
  var user = {
    id: function () { return Promise.resolve(me); },
    me: function () { return Promise.resolve({ id: me, name: '' }); },
    isOwner: function () { return Promise.resolve(true); },
    canEdit: function () { return Promise.resolve(true); },
    can: function () { return Promise.resolve(true); },
    profiles: function () { return Promise.resolve({}); }
  };

  /* ---- room: broadcast for moments, presence for who is here ---- */
  var peerKey = 'p' + Math.random().toString(36).slice(2, 10);
  var roomChan = sb.channel('room', { config: { broadcast: { self: false, ack: false }, presence: { key: peerKey } } });
  var mine = {}, peersCbs = [], peers = [], joined = false, topicCbs = {};
  function buildPeers() {
    var st = roomChan.presenceState(), out = [];
    Object.keys(st).forEach(function (k) {
      var arr = st[k] || [], last = arr[arr.length - 1] || {};
      var pres = Object.assign({}, last); delete pres.presence_ref;
      out.push({ peer: k, by: null, isMe: k === peerKey, sameTab: k === peerKey, kind: 'viewer', guest: false, presence: pres, updatedAt: Date.now() });
    });
    peers = out;
    peersCbs.forEach(function (f) { try { f({ peers: out, joined: [], left: [], updated: [] }); } catch (e) {} });
  }
  ['chat', 'rx', 'del', 'edit', 'pin'].forEach(function (t) {
    roomChan.on('broadcast', { event: t }, function (m) {
      (topicCbs[t] || []).forEach(function (f) { try { f({ topic: t, data: m.payload, peer: '', by: null, isMe: false, sameTab: false, kind: 'viewer', guest: false }); } catch (e) {} });
    });
  });
  roomChan.on('presence', { event: 'sync' }, buildPeers)
    .subscribe(function (status) { if (status === 'SUBSCRIBED') { joined = true; roomChan.track(mine); } });
  var room = {
    emit: function (topic, data) { return roomChan.send({ type: 'broadcast', event: topic, payload: data }).then(function () {}); },
    on: function (topic, f) { (topicCbs[topic] = topicCbs[topic] || []).push(f); return function () { topicCbs[topic] = (topicCbs[topic] || []).filter(function (x) { return x !== f; }); }; },
    presence: function (patch) {
      Object.keys(patch || {}).forEach(function (k) { if (patch[k] === null) delete mine[k]; else mine[k] = patch[k]; });
      return joined ? roomChan.track(mine).then(function () {}) : Promise.resolve();
    },
    peers: function () { return peers; },
    onPeers: function (f) { peersCbs.push(f); setTimeout(function () { f({ peers: peers, joined: peers, left: [], updated: [] }); }, 0); return function () { peersCbs = peersCbs.filter(function (x) { return x !== f; }); }; },
    connected: function () { return joined; }
  };

  var caps = { db: db, user: user, room: room };
  window.claude = { use: function (name) { return Promise.resolve(caps[name] || null); } };
})();

</script>

<style>
/* Anime "sakura dusk" theme: painted sky (or the user's photo) with drifting petals, white glass cards, pink-violet accents, an original anime-style student in the hero. */
:root{
  color-scheme:light;
  --sky-a:#7C86F2; --sky-b:#B79BF0; --sky-c:#FFB3CB; --sky-d:#FFE0C2;
  --bg:#F6EEFF;
  --ink:#2A2346; --muted:#76699A; --line:#ECE2F7;
  --surface:rgba(255,255,255,.86); --surface-solid:#FFFFFF; --surface-2:#FBF6FF; --field:#FFFFFF;
  --accent:#F2547F; --accent-2:#8B6CF6; --on-accent:#FFFFFF; --accent-soft:#FFE4EC; --violet-soft:#EEE7FF;
  --grad:linear-gradient(120deg,#FF6F9C 0%,#C86BF0 55%,#8B6CF6 100%);
  --star:#FFC23D; --star-line:#E79A00;
  --text:#FFFFFF; --text-muted:rgba(255,255,255,.9); --glass:rgba(255,255,255,.28); --glass-line:rgba(255,255,255,.6);
  --tf:#E8692E; --ts:#1E9C86; --tc:#8B5BE0;
  --good:#1D8F5A; --bad:#D63B4E; --good-soft:#DDF5E8; --bad-soft:#FDE1E5;
  --shadow:0 14px 34px rgba(83,52,150,.18),0 2px 6px rgba(83,52,150,.08);
  --font-ui:'M PLUS Rounded 1c',ui-rounded,'Segoe UI',system-ui,sans-serif;
  --font-pop:'Mochiy Pop One','M PLUS Rounded 1c',ui-rounded,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --sky-a:#0E0B2A; --sky-b:#2A1D5C; --sky-c:#6A2E6E; --sky-d:#B5517A;
  --bg:#130F2C; --ink:#F4EEFF; --muted:#B9ADDA; --line:#3A3160;
  --surface:rgba(30,24,58,.84); --surface-solid:#1E183A; --surface-2:#271F4A; --field:#2A2250;
  --accent:#FF7CA3; --accent-2:#A58BFF; --accent-soft:#4A2443; --violet-soft:#32285E;
  --good:#5BD69A; --bad:#FF7A88; --good-soft:#173D2D; --bad-soft:#4A1E28;
  --shadow:0 14px 34px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --sky-a:#0E0B2A; --sky-b:#2A1D5C; --sky-c:#6A2E6E; --sky-d:#B5517A;
  --bg:#130F2C; --ink:#F4EEFF; --muted:#B9ADDA; --line:#3A3160;
  --surface:rgba(30,24,58,.84); --surface-solid:#1E183A; --surface-2:#271F4A; --field:#2A2250;

}

@media (prefers-color-scheme:dark){body.haspic:not([data-theme=light]){--surface:rgba(30,24,58,.8)}}
.bgpic.on .sky{display:none}
.sky{position:absolute;inset:0;width:100%;height:100%}

.petal:nth-child(4n){fill:#FFAFC8}

.app{position:relative;z-index:1;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* hero */
.hero{position:relative;overflow:hidden;background:var(--surface);-webkit-backdrop-filter:blur(14px) saturate(1.2);backdrop-filter:blur(14px) saturate(1.2);border:1.5px solid rgba(255,255,255,.75);border-radius:28px;padding:22px 8px 22px 22px;display:flex;align-items:stretch;gap:4px;box-shadow:var(--shadow);min-height:228px}
.hero::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 90% at 100% 100%,rgba(255,111,156,.22),transparent 60%),radial-gradient(90% 80% at 0% 0%,rgba(139,108,246,.18),transparent 60%);pointer-events:none}
.kanji{position:absolute;right:46%;top:10px;font-family:var(--font-pop);font-size:92px;line-height:1;color:var(--accent-2);opacity:.07;pointer-events:none;writing-mode:vertical-rl;letter-spacing:-.06em}

.badge svg{width:12px;height:12px;fill:currentColor}

.vsn .pen{font-style:normal;font-size:.75em;opacity:.55}
.rnin{width:110px;font:inherit;font-size:16px;font-weight:800;text-align:center;border:1.5px solid #C9B6FF;border-radius:10px;padding:3px 6px;background:#fff;color:#2A2346;outline:none}
.cheer{margin:0 0 12px;font-weight:800;font-size:1rem;color:var(--accent)}
.sum{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:0 0 8px;font-size:.95rem;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.sum b{color:var(--ink);font-weight:800}
.bar{height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--grad);border-radius:999px;transition:width .35s ease;position:relative}
.bar span::after{content:'';position:absolute;inset:2px 6px auto 6px;height:3px;border-radius:9px;background:rgba(255,255,255,.55)}
.girlwrap{position:relative;z-index:1;flex:none;width:clamp(118px,33vw,170px);margin-right:10px}
.girlwrap{margin:6px 0 0;align-self:center}
.me-frame{position:relative;width:100%;aspect-ratio:1;padding:5px;border-radius:42% 58% 52% 48%/52% 44% 56% 48%;background:var(--grad);box-shadow:0 10px 24px rgba(242,84,127,.3);animation:morph 9s ease-in-out infinite}
.me-pic{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit;border:3px solid #fff}
.me-deco{position:absolute;inset:-10%;width:120%;height:120%;pointer-events:none;overflow:visible}
@keyframes morph{50%{border-radius:56% 44% 46% 54%/46% 56% 44% 54%}}
.bubble{position:absolute;left:-14px;bottom:2px;top:auto;z-index:2;background:#fff;color:var(--accent);font-family:var(--font-pop);font-size:.72rem;padding:5px 10px;border-radius:14px;box-shadow:0 4px 12px rgba(83,52,150,.18);white-space:nowrap;transform:rotate(-6deg);animation:bob 3.2s ease-in-out infinite}

.exitbtn{display:inline-flex;align-items:center;gap:2px;padding:6px 14px 6px 8px}

.sp{position:absolute;z-index:1;width:16px;height:16px;fill:var(--star);animation:tw 2.6s ease-in-out infinite}
.sp.a{left:44%;top:16px}

/* shared surfaces */

.hearts{display:flex;flex-wrap:wrap;gap:4px}
.th{width:24px;height:24px;fill:var(--line);stroke:none;transition:transform .2s}
.th.on{fill:var(--star);filter:drop-shadow(0 1px 2px rgba(231,154,0,.4))}
.tcount{font-weight:800;font-variant-numeric:tabular-nums}
.tgl{color:var(--muted);font-size:.85rem;font-weight:700;margin-right:8px}
.done-msg{margin:0;font-weight:800;color:var(--good)}
.tmin{margin:0;font-weight:700;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.quote{margin:0;color:var(--muted);font-weight:500;font-size:.92rem;padding-left:12px;border-left:3px solid var(--accent-soft)}
.swan{position:absolute;right:-6px;bottom:-10px;width:96px;height:auto;pointer-events:none;opacity:.5}


.today{background:linear-gradient(150deg,rgba(255,255,255,.9),rgba(255,236,244,.86) 55%,rgba(240,232,255,.88))!important;border:1.5px solid rgba(255,255,255,.95)!important;box-shadow:0 14px 34px rgba(139,108,246,.18),inset 0 1px 0 #fff!important;gap:14px!important;padding:18px 18px 16px!important}
.today::before{content:"";position:absolute;width:180px;height:180px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(255,181,71,.28),transparent 65%);pointer-events:none}
.today-top b{font-size:1.15rem!important;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tbody{display:flex;align-items:center;gap:16px;position:relative}
.tring{--p:0;flex:none;width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(from -90deg,#FF7EA8 0%,#C46BF0 calc(var(--p)*.5%),#8B6CF6 calc(var(--p)*1%),rgba(139,108,246,.13) 0);box-shadow:0 8px 20px rgba(196,107,240,.25)}
.tring>div{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:inset 0 2px 6px rgba(139,108,246,.12)}
.tring b{font-family:var(--font-pop);font-weight:400;font-size:1.7rem;color:#2A2346}
.tring span{font-size:.72rem;font-weight:800;color:#8a7fb0;margin-top:3px}
.tright{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.tstars{display:grid;grid-template-columns:repeat(10,minmax(0,24px));gap:2px}
.tst{width:100%;height:auto;aspect-ratio:1;overflow:visible;fill:rgba(139,108,246,.14);stroke:rgba(139,108,246,.28);stroke-width:1.2;stroke-linejoin:round;transition:transform .25s}
.tst.on{fill:url(#tsg);stroke:#fff;stroke-width:1.4;filter:drop-shadow(0 2px 4px rgba(255,150,60,.45));animation:tstin .5s cubic-bezier(.3,1.8,.5,1) var(--d) backwards,twk 2.8s ease-in-out calc(var(--d) + .6s) infinite}
@keyframes tstin{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
@keyframes twk{0%,100%{transform:scale(1)}50%{transform:scale(1.12) rotate(6deg)}}
.today .tcount{margin:0;font-weight:800;color:#2A2346;font-size:.95rem}
.today .tmin{font-size:.82rem!important}
.today-mid{padding-top:10px;border-top:1px dashed rgba(139,108,246,.22)}
.today .quote{margin:0;padding:10px 14px;border:0;border-radius:14px;background:rgba(255,255,255,.6);font-style:italic;color:#6b5fa0;font-size:.88rem;position:relative}
.today .quote::before{content:"“";font-family:Georgia,serif;font-size:2rem;line-height:0;vertical-align:-.45em;margin-right:4px;color:#FF7EA8;font-style:normal}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .today{background:linear-gradient(150deg,rgba(43,33,80,.92),rgba(58,34,72,.9) 55%,rgba(36,28,70,.92))!important;border-color:rgba(255,255,255,.14)!important}
 :root:not([data-theme=light]) .tring>div{background:#241c44}:root:not([data-theme=light]) .tring b,:root:not([data-theme=light]) .today .tcount{color:#F4EEFF}
 :root:not([data-theme=light]) .today .quote{background:rgba(255,255,255,.07);color:#CFC3F5}}

.memstat{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;margin-bottom:12px;border-radius:24px;background:linear-gradient(135deg,#FF7EA8 0%,#C46BF0 55%,#8B6CF6 100%);color:#fff;box-shadow:0 12px 30px rgba(196,107,240,.35);position:relative;overflow:hidden}
.memstat::after{content:"";position:absolute;right:-40px;top:-50px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 65%)}
.msl{display:flex;flex-direction:column;line-height:1.1;position:relative;z-index:1}
.msk{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.msn{font-family:var(--font-pop);font-weight:400;font-size:3rem;line-height:1;margin:4px 0 2px;text-shadow:0 3px 12px rgba(80,20,120,.3)}
.mss{font-size:.85rem;font-weight:700;opacity:.92}
.msring{--p:0;position:relative;z-index:1;width:76px;height:76px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.25) 0)}
.msring span{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:rgba(120,60,190,.55);font-weight:800;font-size:1rem}
.lsec{display:flex;align-items:center;gap:8px}
.lcnt{display:inline-grid;place-items:center;min-width:26px;height:22px;padding:0 8px;border-radius:999px;font-size:.78rem;font-weight:800;font-family:var(--font-ui,inherit)}
.lsec.todo .lcnt{background:#FF7EA8;color:#fff;text-shadow:none}
.lsec.got .lcnt{background:#2FBF71;color:#fff;text-shadow:none}
.lsec.got{margin-top:22px}
.lempty{margin:6px 2px 10px;padding:14px 16px;border-radius:16px;background:var(--surface);color:var(--muted);font-weight:700;font-size:.9rem}
.item.moving{animation:imove .42s ease forwards}
@keyframes imove{60%{transform:scale(1.03)}100%{opacity:0;transform:translateX(30px)}}

body[data-tab=list] .frow .seg,body[data-tab=cards] .frow .seg{display:none!important}
.lvtabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.lvt{display:flex;align-items:center;gap:10px;padding:14px;border-radius:20px;border:2px solid rgba(255,255,255,.7);background:var(--surface);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:var(--shadow);color:var(--ink);text-align:left;cursor:pointer;font:inherit}
.lvt .lvi{width:40px;height:40px;flex:none;border-radius:14px;display:grid;place-items:center;font-size:1.3rem;background:rgba(139,108,246,.12)}
.lvt .lvx{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.lvt b{font-size:.95rem;font-weight:800}
.lvt small{font-size:.78rem;font-weight:700;color:var(--muted)}
.lvt.todo.on{background:linear-gradient(135deg,#FF7EA8,#F2547F);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(242,84,127,.35)}
.lvt.got.on{background:linear-gradient(135deg,#3DDC84,#1FAF6A);border-color:transparent;color:#fff;box-shadow:0 10px 24px rgba(31,175,106,.35)}
.lvt.on small{color:rgba(255,255,255,.9)}
.lvt.on .lvi{background:rgba(255,255,255,.25)}

/* word list: high readability */
body[data-tab=list] .bgpic.on::after{background:rgba(250,246,255,.86)}
body[data-tab=list] .frow #picDel,body[data-tab=list] .frow .picdel{display:none!important}
body[data-tab=list] .bgpic:not(.on)::after{content:'';position:absolute;inset:0;background:rgba(250,246,255,.55)}
body[data-tab=list] .list{background:#fff!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;border:1px solid rgba(139,108,246,.18)!important;box-shadow:0 8px 24px rgba(83,52,150,.12)!important}
body[data-tab=list] .item{border-top-color:#F0EAFB}
body[data-tab=list] .word{padding:14px 16px}
body[data-tab=list] .item .en{color:#2A2346;font-weight:700;font-size:1.02rem}
body[data-tab=list] .item.done .en{color:#2A2346;opacity:1}
body[data-tab=list] .rowbar,body[data-tab=list] .rowbar .link{color:#4A3F78!important;text-shadow:none!important}
body[data-tab=list] .lempty{background:#fff}
body[data-tab=list] .adder{background:#fff!important;backdrop-filter:none!important}
body[data-tab=list] .backbar .bt,body[data-tab=list] #bttl{color:#2A2346!important;text-shadow:none!important}
body[data-tab=list] .frow,body[data-tab=list] .frow .link{color:#4A3F78!important;text-shadow:none!important}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body[data-tab=list] .bgpic::after{background:rgba(18,14,36,.8)!important}
 :root:not([data-theme=light]) body[data-tab=list] .list,:root:not([data-theme=light]) body[data-tab=list] .lempty,:root:not([data-theme=light]) body[data-tab=list] .adder{background:#221B40!important;border-color:rgba(255,255,255,.08)!important}
 :root:not([data-theme=light]) body[data-tab=list] .item{border-top-color:rgba(255,255,255,.06)}
 :root:not([data-theme=light]) body[data-tab=list] .item .en{color:#F4EEFF}
 :root:not([data-theme=light]) body[data-tab=list] .rowbar,:root:not([data-theme=light]) body[data-tab=list] .rowbar .link,:root:not([data-theme=light]) body[data-tab=list] #bttl,:root:not([data-theme=light]) body[data-tab=list] .frow .link{color:#CFC3F5!important}}

.scan{margin:0 0 12px}
.scanbtn{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:#fff;border:2px dashed #C9B6FF;cursor:pointer;box-shadow:0 6px 18px rgba(83,52,150,.1);transition:transform .15s}
.scanbtn:active{transform:scale(.98)}
.sci{position:relative;width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FF7EA8 0%,#C46BF0 55%,#8B6CF6 100%);box-shadow:0 6px 14px rgba(196,107,240,.4),inset 0 1px 0 rgba(255,255,255,.35)}
.sci svg{width:26px;height:26px}
.scspark{position:absolute;top:-5px;right:-5px;font-style:normal;font-size:.8rem;color:#FFC94D;text-shadow:0 0 6px rgba(255,201,77,.8)}
.sct{display:flex;flex-direction:column;line-height:1.3}
.sct b{color:#2A2346;font-size:1rem}
.sct small{color:#6b5fa0;font-size:.8rem;font-weight:600}
.scanerr{margin:8px 4px 0;color:#D93A6A;font-weight:700;font-size:.88rem}
.scanbusy{display:flex;align-items:center;gap:14px;padding:14px;border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(83,52,150,.1)}
.scanbusy img{width:64px;height:64px;object-fit:cover;border-radius:12px;flex:none}
.scanbusy div{flex:1;display:flex;flex-direction:column;gap:3px}
.scanbusy b{color:#2A2346}
.scanbusy small{color:#6b5fa0;font-weight:600;font-size:.8rem}
.scanbar{height:6px;border-radius:3px;background:#EEE6FF;overflow:hidden;margin-top:6px}
.scanbar i{display:block;height:100%;width:40%;border-radius:3px;background:linear-gradient(90deg,#FF7EA8,#8B6CF6);animation:scanmv 1.3s ease-in-out infinite}
@keyframes scanmv{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.scanhd{display:flex;flex-direction:column;padding:4px 4px 8px}
.scanhd b{color:#2A2346;font-size:1.05rem}
.scanhd small{color:#6b5fa0;font-weight:600}
.scanlist{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 6px 18px rgba(83,52,150,.1)}
.scanrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-top:1px solid #F0EAFB}
.scanrow:first-child{border-top:0}
.scanrow.off{opacity:.45}
.scchk{width:28px;height:28px;flex:none;border-radius:9px;border:2px solid #C9B6FF;background:#fff;color:#fff;font-weight:900;cursor:pointer}
.scchk[aria-pressed=true]{background:linear-gradient(135deg,#FF7EA8,#8B6CF6);border-color:transparent}
.scf{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scf input{min-width:0;width:100%;font:inherit;font-size:16px;padding:6px 9px;border-radius:10px;border:1.5px solid #EEE6FF;background:#FBF8FF;color:#2A2346}
.scf input:focus{outline:none;border-color:#C9B6FF;background:#fff}
.scf .kjin{grid-column:1/-1}
.scno{min-width:22px;font-size:.75rem;font-weight:800;color:#8a7fb0;text-align:right}
.scmiss{margin-top:6px;padding:8px 10px;border-radius:12px;background:#FFF1DC;color:#9A4A00;font-size:.82rem;font-weight:700}
.aichip{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;background:linear-gradient(135deg,#FFE0EB,#EDE4FF);color:#8B3FD9;font-size:.7rem;font-weight:800;vertical-align:1px}
.aichip .ico{width:11px;height:11px}
.aichip.in{grid-column:1/-1;justify-self:start}
.scdup{grid-column:1/-1;font-size:.72rem;font-weight:700;color:#8a7fb0}
.scf input.mnin{font-weight:700}
.scanact{display:flex;gap:10px;justify-content:flex-end;margin-top:10px}
.scanact .btn[disabled]{opacity:.45}

/* ===== icon system ===== */
.ico{width:22px;height:22px;flex:none;display:block}
.tic{width:46px!important;height:46px!important;border-radius:15px!important;color:#fff!important;background:linear-gradient(135deg,#B9A3FF,#8B6CF6)!important;box-shadow:0 6px 14px rgba(139,108,246,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.tic .ico{width:24px;height:24px;fill:none!important}
.tile.t-list .tic{background:linear-gradient(135deg,#FF9DBD,#F2547F)!important;box-shadow:0 6px 14px rgba(242,84,127,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.tile.t-cards .tic{background:linear-gradient(135deg,#C9A6FF,#9A5AF0)!important}
.tile.game .tic{background:linear-gradient(135deg,#FFC65C,#F2547F)!important;box-shadow:0 6px 14px rgba(255,150,80,.35)}
.tile.tphoto .tic{background:linear-gradient(135deg,#7FD6E8,#8B6CF6)!important;box-shadow:0 6px 14px rgba(110,170,240,.35)}
.tile.big .tic{background:rgba(255,255,255,.22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile .tt{font-weight:800}
.lvt .lvi{color:#8B6CF6;background:rgba(139,108,246,.12)!important}
.lvt .lvi .ico{width:22px;height:22px}
.lvt.on .lvi{color:#fff;background:rgba(255,255,255,.25)!important}
.vstk .fl{width:14px;height:14px;fill:url(#flg);stroke:#EA580C;stroke-width:1.6;margin-right:2px}
.lempty{display:flex;align-items:center;gap:10px}
.lempty .ico{color:#F2547F}
.hic{display:flex;align-items:center;gap:10px}
.hic .ico,.thd .ico{width:30px;height:30px;padding:6px;border-radius:10px;color:#fff;background:linear-gradient(135deg,#FFC65C,#F2547F);box-shadow:0 4px 10px rgba(242,84,127,.3)}
.thd{display:inline-flex;align-items:center;gap:10px}
.thd .ico{background:linear-gradient(135deg,#FF7EA8,#8B6CF6)}
.today-top b.thd{background:none!important;-webkit-background-clip:border-box!important;background-clip:border-box!important;color:#2A2346!important}
/* ===== laptop layout ===== */
@media (min-width:1100px){
 .app{max-width:1180px;padding:0 24px}
 body[data-tab=home] .app{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:24px;row-gap:18px;align-items:start}
 body[data-tab=home] #view{display:contents}
 body[data-tab=home] .hero{grid-column:1;grid-row:1;align-self:stretch}
 body[data-tab=home] #today{grid-column:1;grid-row:2}
 body[data-tab=home] .homelb{grid-column:1;grid-row:3}
 body[data-tab=home] .vs{grid-column:2;grid-row:1;align-self:stretch;display:grid}
 body[data-tab=home] .vsbets{grid-column:2}
 body[data-tab=home] .tiles{grid-column:2;grid-row:2/span 2}
 body[data-tab=home] .foot{grid-column:1/-1}
 body[data-tab=home] .tiles .tile{min-height:150px;padding:20px}
 body[data-tab=home] .tiles .tile.big{min-height:170px}
 body:not([data-tab=home]) .app{max-width:980px}
 body[data-tab=list] #listBody .list{display:grid;grid-template-columns:1fr 1fr}
 body[data-tab=list] #listBody .item{border-top:1px solid #F0EAFB}
 body[data-tab=list] #listBody .item:nth-child(odd){border-right:1px solid #F0EAFB}
 body[data-tab=list] #listBody .item:nth-child(-n+2){border-top:0}
 body[data-tab=list] #memBox,body[data-tab=list] #scanBox{max-width:none}
 body[data-tab=quiz] #view,body[data-tab=cards] #view,body[data-tab=g2048] #view{max-width:680px;width:100%;margin:0 auto}
 .chatpanel{width:400px!important;height:min(680px,calc(100vh - 120px))!important}
}
@media (min-width:1100px) and (max-height:760px){.hero{min-height:0}}

/* streak chip v2 */
.skc{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 6px;border-radius:999px;background:rgba(139,108,246,.1);color:#7a6fa8;font-size:.8rem;font-weight:800;white-space:nowrap;line-height:1}
.skc .ff{width:22px;height:22px;padding:4px;border-radius:50%;fill:currentColor;stroke:none;background:rgba(139,108,246,.15);color:#9a8fc8}
.skc.on{background:linear-gradient(135deg,#FFB347 0%,#FF6A3D 55%,#FF3D77 100%);color:#fff;box-shadow:0 6px 16px rgba(255,106,61,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.skc.on .ff{background:rgba(255,255,255,.25);color:#fff;animation:flk 1.6s ease-in-out infinite;transform-origin:50% 90%}
.skc.on b{font-size:1rem;font-weight:900;font-variant-numeric:tabular-nums}
.skc.on span{opacity:.92;font-weight:700}
@keyframes flk{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.08) rotate(-4deg)}60%{transform:scale(.96) rotate(3deg)}}
.skc.sm{margin-top:8px;font-size:.72rem;padding:4px 10px 4px 4px}
.skc.sm .ff{width:19px;height:19px;padding:3px}
.skc.sm.on b{font-size:.9rem}
.today-top b.thd{font-family:var(--font-ui,inherit)!important;font-weight:800!important;font-size:1.1rem!important;color:#2A2346!important;-webkit-text-fill-color:#2A2346!important}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .today-top b.thd{color:#F4EEFF!important;-webkit-text-fill-color:#F4EEFF!important}}
:root[data-theme=dark] .today-top b.thd{color:#F4EEFF!important;-webkit-text-fill-color:#F4EEFF!important}
.girlwrap{position:relative}
.avedit{position:absolute;right:4%;bottom:6%;z-index:3;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FF7EA8,#8B6CF6);border:3px solid #fff;box-shadow:0 4px 12px rgba(139,108,246,.45);cursor:pointer;transition:transform .15s cubic-bezier(.3,1.6,.5,1)}
.avedit:hover{transform:scale(1.08)}
.avedit:active{transform:scale(.9)}
.avedit svg{width:16px;height:16px}
body[data-gate=on] .avedit{display:none}
.me-frame.avpop{animation:avp .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes avp{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}

/* ===== packs ===== */
.packbar{display:flex;flex-direction:column;gap:8px;margin:0 0 12px;padding:12px;border-radius:20px;background:#fff;box-shadow:0 6px 18px rgba(83,52,150,.1)}
.pkrow{display:flex;align-items:center;gap:10px;min-width:0}
.pkl{flex:none;width:74px;font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a7fb0}
.pks{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:2px 0}
.pks::-webkit-scrollbar{display:none}
.pchip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;border:1.5px solid #EEE6FF;background:#FBF8FF;color:#4A3F78;font:inherit;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap;transition:transform .12s}
.pchip b{font-size:.7rem;font-weight:800;padding:1px 7px;border-radius:999px;background:#EEE6FF;color:#6A48D0}
.pchip.on{background:linear-gradient(135deg,#FF7EA8,#8B6CF6);border-color:transparent;color:#fff;box-shadow:0 4px 12px rgba(196,107,240,.35)}
.pchip.on b{background:rgba(255,255,255,.25);color:#fff}
.pchip:active{transform:scale(.95)}
.pkhd{margin:14px 4px 6px;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#6b5fa0}
body[data-tab=list] .pkhd{color:#6b5fa0}
@media (min-width:1100px){body[data-tab=list] #listBody .pkhd{grid-column:1/-1}}
/* ===== quiz setup ===== */
.qsetup{gap:14px}
.qmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.qm{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 14px;border-radius:16px;border:2px solid #EEE6FF;background:#FBF8FF;color:#2A2346;font:inherit;text-align:left;cursor:pointer}
.qm b{font-size:.95rem}
.qm small{font-size:.75rem;color:#8a7fb0;font-weight:600}
.qm.on{border-color:#C46BF0;background:linear-gradient(135deg,rgba(255,126,168,.12),rgba(139,108,246,.14));box-shadow:0 4px 14px rgba(196,107,240,.2)}
.qinfo{margin:0;color:#2A2346}
.qcyc{margin:0;font-size:.82rem;font-weight:700;color:#8a7fb0}
.qpts{margin:0;font-size:.85rem;color:#6b5fa0}
.btn.big{padding:14px 18px;font-size:1rem}
.qwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.qhint{border:1.5px dashed #C9B6FF;background:none;color:#8B6CF6;border-radius:999px;padding:4px 12px;font:inherit;font-size:.78rem;font-weight:800;cursor:pointer}
.qread{display:none}
.qwrap.shown .qread{display:block;animation:pop .2s ease-out}
.qwrap.shown .qhint{display:none}
.qafter{margin:4px 0 0;font-weight:800;color:#8B6CF6;font-size:1.05rem}
.qword.qmn{font-family:var(--font-ui,inherit);font-weight:800;font-size:clamp(1.5rem,6vw,2.1rem)}
/* ===== flashcard side switch ===== */
.cmodes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 10px;padding:8px 12px;border-radius:16px;background:#fff;box-shadow:0 4px 14px rgba(83,52,150,.08);font-size:.8rem;font-weight:800;color:#6b5fa0}
.seg2{display:inline-flex;padding:3px;border-radius:999px;background:#F3EEFF}
.seg2 button{border:0;background:none;padding:6px 12px;border-radius:999px;font:inherit;font-size:.8rem;font-weight:800;color:#6b5fa0;cursor:pointer}
.seg2 button.on{background:linear-gradient(135deg,#FF7EA8,#8B6CF6);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .packbar,:root:not([data-theme=light]) .cmodes{background:#221B40}
 :root:not([data-theme=light]) .pchip{background:#2B2350;border-color:#3A3068;color:#E9E1FF}
 :root:not([data-theme=light]) .qm{background:#2B2350;border-color:#3A3068;color:#F4EEFF}
 :root:not([data-theme=light]) .qinfo{color:#F4EEFF}:root:not([data-theme=light]) .seg2{background:#2B2350}}

.betstrip{display:flex;align-items:center;gap:12px;margin-top:14px;padding:10px 10px 10px 12px;border-radius:18px;background:linear-gradient(135deg,rgba(255,126,168,.12),rgba(139,108,246,.14));border:1.5px dashed rgba(196,107,240,.45);grid-column:1/-1}
.betstrip.on{border-style:solid;border-color:transparent;background:linear-gradient(135deg,#FFE7B3,#FFD0E0);box-shadow:0 6px 16px rgba(255,170,80,.25)}
.betstrip.off{opacity:.75}
.bsi{width:38px;height:38px;flex:none;border-radius:12px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FFC65C,#F2547F);box-shadow:0 4px 10px rgba(242,84,127,.3)}
.bsi .ico{width:20px;height:20px}
.bst{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.25}
.bst small{font-size:.68rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#8a7fb0}
.bst b{font-size:.95rem;color:#2A2346;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bsb{flex:none;padding:8px 14px!important;font-size:.85rem!important}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bst b{color:#F4EEFF}:root:not([data-theme=light]) .betstrip.on b{color:#2A2346}}

.cset{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.82rem;font-weight:800;color:#6b5fa0}
.link2{border:0;background:none;color:#8B6CF6;font:inherit;font-weight:800;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
body[data-tab=cards] .frow #picDel,body[data-tab=quiz] .frow #picDel{display:none!important}

/* ===== learning aids ===== */
.lvd{display:inline-flex;gap:2px;margin-left:8px;vertical-align:middle}
.lvd i{width:5px;height:5px;border-radius:50%;background:#E5DCF7}
.lvd i.on{background:linear-gradient(135deg,#FF7EA8,#8B6CF6)}
.lvd.new{font-family:var(--font-ui,inherit);font-size:.6rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:#C9B6FF;padding:1px 6px;border-radius:999px}
.card .lvd{position:absolute;top:18px;right:18px;margin:0}
.say{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:linear-gradient(135deg,#FF7EA8,#8B6CF6);color:#fff;cursor:pointer;box-shadow:0 4px 10px rgba(196,107,240,.35);flex:none}
.say svg{width:18px;height:18px}
.card .say{position:absolute;top:14px;right:14px;z-index:2}
.revban{display:flex;align-items:center;gap:12px;width:100%;margin:0 0 12px;padding:12px 14px;border:0;border-radius:20px;background:linear-gradient(135deg,#FFE7B3,#FFD0E0);color:#2A2346;text-align:left;font:inherit;cursor:pointer;box-shadow:0 6px 16px rgba(255,170,80,.25)}
.rvi{width:40px;height:40px;flex:none;border-radius:13px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#FFC65C,#F2547F)}
.rvt{flex:1;display:flex;flex-direction:column;line-height:1.25}
.rvt b{font-size:.95rem}.rvt small{font-size:.75rem;color:#7a5a6a;font-weight:600}
.rvgo{font-weight:800;color:#D93A6A;white-space:nowrap}
.seg2.s3 button{padding:6px 9px;font-size:.74rem}
.qtype{display:flex;gap:8px}
.qtype input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:14px;border:2px solid #E5DCF7;background:#fff;color:#2A2346}
.qtype input:focus{outline:none;border-color:#C46BF0;box-shadow:0 0 0 4px rgba(196,107,240,.15)}
.qtres{padding:12px 14px;border-radius:14px;font-weight:800}
.qtres.ok{background:#E3F8EC;color:#1E9E5A}.qtres.no{background:#FFE6EC;color:#D93A6A}
.qcard{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid #EEE6FF;margin:8px 0}
.qck{font-size:1.5rem;color:#F2547F}
.qcr{font-size:1.05rem;color:#2A2346}
.qcm{flex:1;color:#6A48D0;font-weight:800}
.qmiss{display:flex;flex-direction:column;gap:6px;margin:10px 0;padding:12px;border-radius:16px;background:#FFF6F9;border:1.5px solid #FFD6E2}
.qmiss>b{color:#D93A6A}.qmiss small{color:#8a7fb0;font-weight:600}
.qmr{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px;background:#fff}
.qmr .say{width:30px;height:30px}.qmr .say svg{width:15px;height:15px}
.wno{flex:none;align-self:center;min-width:34px;padding-left:12px;font-size:.78rem;font-weight:800;color:#8a7fb0;font-variant-numeric:tabular-nums;text-align:right}
body[data-tab=list] .wno+.word{padding-left:10px}
.stkrow{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.stkrow .skc.sm{margin-top:0}
.memc{display:inline-flex;align-items:center;gap:5px;padding:4px 10px 4px 5px;border-radius:999px;background:linear-gradient(135deg,#B9A3FF,#8B6CF6);color:#fff;font-size:.72rem;font-weight:700;white-space:nowrap;box-shadow:0 4px 12px rgba(139,108,246,.3)}
.memc .ico{width:19px;height:19px;padding:3px;border-radius:50%;background:rgba(255,255,255,.25)}
.memc b{font-size:.9rem;font-weight:900}
.qno{margin-left:6px;padding:1px 7px;border-radius:999px;background:rgba(139,108,246,.12);color:#8B6CF6;font-weight:800;font-size:.72rem}
.pchip.sz{min-width:40px;justify-content:center}
.rngf{display:flex;align-items:center;gap:6px}
.rngf input{width:68px;font:inherit;font-size:16px;padding:6px 10px;border-radius:999px;border:1.5px solid #EEE6FF;background:#FBF8FF;color:#2A2346;text-align:center}
.rngf input:focus{outline:none;border-color:#C9B6FF}
.rngf>span{color:#8a7fb0;font-weight:800}
/* tabs + segmented */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid var(--glass-line);border-radius:999px;padding:8px 16px;font-weight:800;font-size:.92rem;color:#fff;text-shadow:0 1px 6px rgba(42,35,70,.35);transition:transform .15s}
.tabs button:hover{transform:translateY(-1px)}
.tabs button[aria-selected=true]{background:var(--grad);border-color:transparent;color:#fff;text-shadow:none;box-shadow:0 8px 18px rgba(242,84,127,.35)}
.ic{width:14px;height:14px;fill:currentColor;margin-right:6px;vertical-align:-2px}
.rowbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#fff;font-size:.9rem;font-weight:700;text-shadow:0 1px 6px rgba(42,35,70,.4)}
.panel .rowbar,.wrap .rowbar{text-shadow:0 1px 6px rgba(42,35,70,.4)}
.seg{display:inline-flex;border:1.5px solid var(--glass-line);border-radius:999px;overflow:hidden;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.seg button{background:none;border:0;padding:6px 14px;color:#fff;font-size:.88rem;font-weight:800}
.seg button[aria-pressed=true]{background:var(--surface-solid);color:var(--accent);border-radius:999px}
.today .seg{background:var(--surface-2);border-color:var(--line);backdrop-filter:none}
.today .seg button{color:var(--muted)}
.today .seg button[aria-pressed=true]{background:var(--grad);color:#fff}
.goalset button{padding:4px 12px}
.goalset input{width:54px;margin:2px;padding:3px 6px;border-radius:999px;border:1.5px dashed var(--line);background:var(--field);color:var(--ink);font-weight:800;text-align:center;font-size:.88rem}
.goalset input:focus{border-style:solid;border-color:var(--accent-2);outline:none}
.link{background:none;border:0;padding:6px 2px;color:#fff;font-weight:800;text-decoration:underline;text-underline-offset:3px;font-size:.9rem}
.panel .link,.betbox .link{color:var(--accent-2);text-shadow:none}
.picbtn{display:inline-block;background:var(--glass);border:1.5px solid var(--glass-line);color:#fff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:.85rem;cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.picmsg{font-size:.82rem;color:#fff}

/* list */
.sec{font-family:var(--font-pop);font-weight:400;font-size:1rem;margin:16px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:#fff;text-shadow:0 2px 8px rgba(42,35,70,.35)}
.sec::before{content:'';width:10px;height:10px;border-radius:3px;transform:rotate(45deg);background:currentColor;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.sec.tF::before{background:#FFB37A} .sec.tS::before{background:#6FE0C6} .sec.tC::before{background:#C9A7FF} .sec.tX::before,.sec.tY::before{background:#FF9BBE}
.sec code{font-family:var(--font-ui);font-size:.85rem;font-weight:700;background:rgba(255,255,255,.25);padding:1px 10px;border-radius:999px;text-shadow:none}
.list{border-radius:20px;overflow:hidden}
.item{display:flex;align-items:stretch;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item.hid{display:none}
.word{flex:1;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:12px 16px;transition:background .15s}
.word:hover{background:var(--surface-2)}
.en{font-family:var(--font-pop);font-weight:400;font-size:1.02rem;overflow-wrap:anywhere;color:var(--ink)}
.peek{flex:none;background:var(--violet-soft);color:var(--accent-2);font-size:.75rem;font-weight:800;padding:2px 12px;border-radius:999px}
.mean{display:none;background:var(--grad);color:#fff;text-align:right;font-size:.95rem;font-weight:800;padding:2px 12px;border-radius:999px;overflow-wrap:anywhere}
.item.open .mean,.wrap.all .mean{display:inline}
.item.open .peek,.wrap.all .peek{display:none}
.item.done .en{color:var(--muted)}
.chk{flex:none;width:58px;background:none;border:0;border-left:1px solid var(--line);display:grid;place-items:center}
.hrt{width:28px;height:28px;fill:var(--line);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
.chk:hover .hrt{fill:#FFE3A0}
.chk[aria-pressed=true] .hrt{fill:var(--star);transform:scale(1.15) rotate(18deg);filter:drop-shadow(0 2px 3px rgba(231,154,0,.45))}
.del{flex:none;width:40px;background:none;border:0;border-left:1px solid var(--line);color:var(--muted);font-size:1.2rem;font-weight:800}
.by{display:block;font-family:var(--font-ui);font-weight:600;font-size:.75rem;color:var(--muted);margin-top:1px}
.hintline{color:var(--muted);font-size:.9rem;margin:0;font-weight:600}

/* flashcard */
.card{position:relative;border-radius:26px;padding:26px;min-height:280px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;cursor:pointer;text-align:left;overflow:hidden}
.card::before{content:'';position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(255,111,156,.22),transparent 70%)}
.card.back{background:linear-gradient(150deg,var(--surface-solid),var(--accent-soft))}
.card .type{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;color:var(--accent-2)}
.card .big{font-family:var(--font-pop);font-weight:400;line-height:1.15;font-size:clamp(2rem,9.5vw,3rem);overflow-wrap:anywhere;margin:0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .big.mn{font-family:var(--font-ui);font-weight:800;font-size:clamp(1.7rem,7.6vw,2.4rem);background:none;color:var(--ink)}
.card .ex{margin:10px 0 0;color:var(--muted);font-size:1.05rem}
mark{background:#FFE7A3;color:#2A2346;padding:0 5px;border-radius:6px;font-weight:800}
.stk{position:absolute;right:22px;top:20px;width:26px;height:26px;fill:var(--star)}
.stk.s2{right:30px;top:auto;bottom:24px;width:16px;height:16px;fill:var(--accent);opacity:.5}
.pop{animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
@keyframes pop{from{transform:scale(.94) rotate(-1.5deg);opacity:.4}to{transform:none;opacity:1}}
.count{color:#fff;font-size:.9rem;font-weight:800;font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{padding:13px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface-solid);color:var(--ink);font-weight:800;transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(83,52,150,.15)}
.btn:active{transform:translateY(1px)}
.btn.know{color:var(--good)} .btn.miss{color:var(--bad)}
.btn.primary{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(242,84,127,.3)}

/* panels */
.panel{border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px}
.panel h2{margin:0;font-family:var(--font-pop);font-size:1.25rem;font-weight:400;color:var(--ink)}
.panel p{margin:0}
.empty{color:#fff;padding:18px 4px;font-weight:700;text-shadow:0 1px 6px rgba(42,35,70,.4)}
.wrap .empty{color:var(--ink);text-shadow:none;background:var(--surface);border-radius:18px;padding:16px 18px}
.foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;padding:10px 16px;border-radius:999px;background:rgba(42,35,70,.42);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin-bottom:84px;color:#fff;font-size:.85rem;font-weight:700;text-shadow:0 1px 6px rgba(42,35,70,.45)}
.foot .link{font-size:.85rem}

/* adder */
.adder{border-radius:20px;margin-bottom:12px}
.adder>summary{cursor:pointer;list-style:none;padding:13px 18px;font-weight:800;color:var(--accent)}
.adder>summary::-webkit-details-marker{display:none}
.adder[open]>summary{border-bottom:1px solid var(--line)}
#addForm{display:flex;flex-direction:column;gap:10px;padding:14px 18px 4px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.f2{grid-template-columns:1fr}}
.adder input,.adder select,.adder textarea,#whoForm input,.betf input,.betf select{width:100%;padding:11px 14px;border:1.5px solid var(--line);border-radius:14px;background:var(--field);color:var(--ink)}
.adder input:focus,.adder select:focus,.adder textarea:focus,#whoForm input:focus,.betf input:focus,.betf select:focus{outline:none;border-color:var(--accent-2);box-shadow:0 0 0 4px var(--violet-soft)}
.adder textarea{resize:vertical}
.opt2{padding:6px 18px}
#addForm .opt2{padding-inline:0}
.opt2>summary{cursor:pointer;color:var(--muted);font-size:.9rem;font-weight:700;padding:4px 0}
.opt2[open]{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.addmsg{margin:0;padding:6px 18px 14px;font-weight:800;color:var(--good);min-height:1.5em;overflow-wrap:anywhere}
.adder .shr{display:flex;gap:10px;align-items:center;padding:12px 18px 0;font-weight:800;cursor:pointer}
.adder .shr input[type=checkbox]{width:20px;height:20px;padding:0;flex:none;accent-color:var(--accent)}
.shr small{color:var(--muted);font-weight:600}
.shrnote{margin:0;padding:12px 18px 0;color:var(--muted);font-size:.88rem;font-weight:600}

/* confetti */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf{position:absolute;top:-30px;animation:fall linear forwards}
.cf.c0{fill:#FFB3CB} .cf.c1{fill:var(--star)} .cf.c2{fill:#C9A7FF}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg)}}

/* team + peek */
.trow{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.tname{font-family:var(--font-pop);font-weight:400;overflow-wrap:anywhere}
.tbar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.tbar span{display:block;height:100%;background:var(--grad);border-radius:999px}
.tnums{color:var(--muted);font-size:.9rem}
.tnums b{color:var(--ink)}
.peekw summary{cursor:pointer;font-size:.85rem;font-weight:700;color:var(--accent-2)}
.chipbox{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chipw{background:var(--violet-soft);color:var(--accent-2);border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:800}
body[data-tab=team] .frow{display:none}

/* gate */
body[data-gate=on] .tabs,body[data-gate=on] .frow,body[data-gate=on] #today,body[data-gate=on] #view,body[data-gate=on] .foot{display:none}
#gate{display:flex;flex-direction:column;gap:16px}
#gate[hidden]{display:none}
.who-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.who-btns .btn:only-child{grid-column:1/-1}
#whoForm{display:flex;flex-direction:column;gap:10px}
#whoForm .addmsg{padding:0;min-height:0}
#whoForm label{font-weight:800}
body[data-tab=quiz] .frow,body[data-tab=board] .frow{display:none}

/* quiz */
.panel .ex{margin:0;color:var(--muted);font-size:1.05rem}
.qhead{display:flex;justify-content:space-between;color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.qword{font-family:var(--font-pop);font-weight:400;font-size:clamp(1.9rem,8.6vw,2.8rem);margin:0;overflow-wrap:anywhere;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.qopts{display:flex;flex-direction:column;gap:8px}
.qopt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);border-radius:16px;font-weight:700;transition:transform .12s,border-color .12s}
.qopt:hover{border-color:var(--accent-2);transform:translateX(2px)}
.qopt kbd{font-family:var(--font-pop);font-size:.75rem;color:var(--accent-2);background:var(--violet-soft);border-radius:8px;padding:2px 8px}
.qopt .mk{margin-left:auto;font-weight:800}
.qopt.ok{border-color:var(--good);background:var(--good-soft)}
.qopt.no{border-color:var(--bad);background:var(--bad-soft)}
.qfb{border-top:1.5px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px}
.qfb .v{font-weight:800}
.qfb .v.ok{color:var(--good)}
.qfb .v.no{color:var(--bad)}
.qscore{font-family:var(--font-pop);font-size:2.8rem;line-height:1;margin:0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* leaderboard */
.lrow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lrow.me{background:var(--accent-soft);margin-inline:-10px;padding-inline:10px;border-radius:14px;border-top-color:transparent}
.lrank{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-pop);font-size:.9rem;background:var(--line);color:var(--ink);font-variant-numeric:tabular-nums}
.lrank.r1{background:linear-gradient(135deg,#FFE27A,#FFB23D);color:#5A3A00;box-shadow:0 3px 8px rgba(255,178,61,.45)}

.pick:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(83,52,150,.18)}

.pava.c0{background:linear-gradient(135deg,#B9A3FF,#7B5CF0)}.pava.c1{background:linear-gradient(135deg,#7EE2C8,#22A88A)}.pava.c2{background:linear-gradient(135deg,#FFC48A,#F0803C)}.pava.c3{background:linear-gradient(135deg,#8FD0FF,#3D8BEA)}

  background:

.cfocus .cpick button.mine::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:#FFA9C6}
.cfocus .cpick button.more{font-size:1.4rem;font-weight:400;color:#fff;background:rgba(255,255,255,.12);width:36px;height:36px;margin:3px 0 3px 4px}
.cfocus .cpick button.chosen{transform:scale(1.6) translateY(-8px)!important;transition:transform .14s}
.cfocus .cpick.wide{border-radius:22px;padding:8px}
.cmore{display:grid;grid-template-columns:repeat(6,40px);gap:4px;max-height:220px;overflow-y:auto}
.cmore button{width:40px!important;height:40px!important;font-size:1.6rem!important;animation:none!important}
.cmore button:active{transform:scale(1.3)}
.cfocus .cmenu{position:absolute;margin:0;min-width:180px;animation:pkin .26s cubic-bezier(.2,1.4,.4,1) .04s backwards}
.crx{display:inline-flex;align-items:center;gap:1px}
.crx b{font-size:.72rem;margin-left:3px;font-weight:800;color:#CFC3F5}
.crx.mine{border-color:#FF8DB0;background:#3A2B63}
.crx.pop{animation:rxpop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes rxpop{0%{transform:scale(0)}60%{transform:scale(1.35)}100%{transform:scale(1)}}
/* press feedback */
button,.tile,.picbtn,summary,[data-a],[data-tab]{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn,.tile,.back,.qopt,.word,.chk,.picbtn,.seg button,.vsx{position:relative;overflow:hidden}
.exitbtn{overflow:hidden}
.btn,.tile,.back,.qopt,.chk,.exitbtn,.picbtn,.seg button,.link,.adder>summary,.word,.del{transition:transform .14s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,background-color .2s,filter .2s}
.btn:active,.back:active,.exitbtn:active,.picbtn:active,.seg button:active{transform:scale(.94)!important}
.tile:active{transform:scale(.95)!important;box-shadow:0 4px 10px rgba(83,52,150,.18)}
.qopt:active{transform:scale(.97)!important}
.link:active,.del:active{transform:scale(.9)}
.word:active{background:var(--violet-soft)}
.chk:active .hrt{transform:scale(.7) rotate(-20deg)}
.is-pressed{filter:brightness(.97)}
.rpl{position:absolute;border-radius:50%;pointer-events:none;transform:translate(-50%,-50%) scale(0);background:radial-gradient(circle,rgba(255,255,255,.75) 0%,rgba(255,180,210,.45) 45%,rgba(139,108,246,0) 70%);animation:rpl .55s ease-out forwards;z-index:3}
.tile:not(.big) .rpl,.word .rpl,.qopt .rpl,.chk .rpl,.btn:not(.primary) .rpl,.back .rpl,.exitbtn .rpl{background:radial-gradient(circle,rgba(242,84,127,.28) 0%,rgba(139,108,246,.18) 45%,rgba(139,108,246,0) 70%)}
@keyframes rpl{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.burst{position:fixed;pointer-events:none;z-index:60;width:0;height:0}
.burst i{position:absolute;left:0;top:0;width:7px;height:7px;border-radius:50%;background:var(--star);animation:bst .5s ease-out forwards}
.burst i:nth-child(2n){background:var(--accent);width:5px;height:5px}
.burst i:nth-child(3n){background:var(--accent-2)}
@keyframes bst{from{transform:translate(-50%,-50%)}to{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.2);opacity:0}}
/* tile polish */
.tile{box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.9)}
.tile:hover{box-shadow:0 18px 36px rgba(83,52,150,.22),inset 0 1px 0 rgba(255,255,255,.9)}
.tile .tic{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tile:hover .tic{transform:rotate(-8deg) scale(1.08)}
.tile.big::after{content:'';position:absolute;top:-40%;left:-30%;width:40%;height:180%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(20deg);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{0%,60%{left:-40%}100%{left:130%}}
.tile.big .tt::after{content:' →';opacity:.85}
.btn.primary:hover{filter:brightness(1.05)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.confetti,.petals{display:none}}
</style>

    if(m.length>=3&&HAN.test(m[1])&&!HAN.test(m[0])){kj=m[1];m=[m[0]].concat(m.slice(2));}
    else if(m.length>=3&&HAN.test(m[0])&&!HAN.test(m[1])){kj=m[0];m=m.slice(1);}
    if(m.length>=2){en=m[0];mn=m.slice(1).join(', ');}
    else{var mm=line.match(/^([^-–—]+?)\s*[-–—]\s*(.+)$/);if(mm){en=mm[1];mn=mm[2];}}

    jobs.push([en,mn,kj]);
  });

  jobs.forEach(function(j){
    p=p.then(function(){return addWord(j[0],j[1],'X','',seen,j[2],bid).then(function(r){
      if(r==='ok')ok++;else if(r==='dup')dup++;else if(r==='ro'){ro=true;fail++;}else if(r!=='empty')fail++;

function flipFx(){

  if(!soundOn())return;

    var AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    actx=actx||new AC();if(actx.state==='suspended')actx.resume();
    var t=actx.currentTime;
    function flick(at,vol,freq){
      var len=.05,buf=actx.createBuffer(1,Math.floor(actx.sampleRate*len),actx.sampleRate),d=buf.getChannelData(0);
      for(var i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,4);

      var g=actx.createGain();g.gain.value=vol;
      src.connect(lp);lp.connect(g);g.connect(actx.destination);src.start(at);
    }

  }catch(e){}
}

function buildQ(w,mode,pool){
  if(mode==='type')return{w:w,mode:mode,opts:[{l:w.en,ok:true}],typed:''};
  var key=mode==='read'?'en':mode==='rev'?(w.kj?'kj':'en'):'mn',ans=mode==='rev'?(w.kj?w.kj+' · '+w.en:w.en):w[key];
  var seen={};seen[normMn(ans)]=1;

  if(mode==='read')src=src.filter(function(x){return x.kj;}).concat(shuffle(words).filter(function(x){return x.kj;}));

    if(opts.length>=4||x.id===w.id)return;

  var take=q.slice(0,QS),left=q.slice(QS);
  try{localStorage.setItem(rotKey(mode),JSON.stringify(left));}catch(e){}
  Q.left=left.length;Q.total=pool.length;
  Q.qs=shuffle(take).map(function(id){return buildQ(byId(id),mode,pool);}).filter(function(x){return x.w;});

function quizPick(k){
  if(Q.phase!=='run'||Q.picked!==null)return;

  if(q.opts[k].ok){Q.score++;Q.gain+=QPTS;}else{Q.miss.push(q.w.id);}
  srsGrade(q.w.id,!!q.opts[k].ok);if(soundOn())setTimeout(function(){sayW(q.w);},200);

  if(ok){Q.score++;Q.gain+=QPTS;}else Q.miss.push(q.w.id);
  srsGrade(q.w.id,ok);if(soundOn())setTimeout(function(){sayW(q.w);},200);render();

function quizNext(){

    Q.phase='end';
    try{var rk=rotKey(Q.qs[0]?Q.qs[0].mode:'mean'),rq=JSON.parse(localStorage.getItem(rk)||'[]');rq=Q.miss.concat(rq.filter(function(id){return Q.miss.indexOf(id)<0;}));localStorage.setItem(rk,JSON.stringify(rq));}catch(e){}
    quiz.pts+=Q.gain;quiz.rounds++;

/* ---------- team (owner view) ---------- */
var team=[];
function peekList(r){
  var ws=[];(r.done||[]).forEach(function(id){var w=byId(id);if(w)ws.push(w);});
  var extra=r.known-ws.length;
  var body=ws.length?ws.map(function(w){return '<span class="chipw">'+esc(w.en)+'</span>';}).join(' '):'<small>No list words memorized yet.</small>';
  return '<details class="peekw"><summary>Memorized words ('+ws.length+')</summary><div class="chipbox">'+body+(extra>0?' <small>+ '+extra+' of their own words</small>':'')+'</div></details>';
}
function teamHTML(){
  if(!team.length)return '<div class="panel"><h2>Үзээ гаргая</h2><p>Nobody has shared progress yet. Friends will appear here once they enter a name and start memorizing.</p></div>';
  var tk=dkey(new Date());
  var rows=team.slice().sort(function(a,b){return (b.known-a.known)||(b.last-a.last);}).map(function(r){
    var pct=r.total?Math.round(r.known/r.total*100):0;
    var td=(r.days&&r.days[tk])||0;
    return '<div class="trow"><div class="tname">'+esc(dname(r.name))+(r.me?' (me)':'')+'</div><div class="tbar"><span style="width:'+pct+'%"></span></div>'+
      '<div class="tnums"><b>'+r.known+' / '+r.total+'</b> words · today '+fmtMin(td)+' · total '+fmtMin(r.sec)+'<br><small>Last seen: '+agoText(r.last)+'</small></div>'+peekList(r)+'</div>';
  }).join('');
  return '<div class="panel"><h2>Үзээ гаргая ('+team.length+')</h2>'+rows+'<p class="hintline">Only you can see this.</p></div>';
}
function refreshTeam(){var v=$('#view');if(v&&S.tab==='team')v.innerHTML=teamHTML();}
function onTeam(snap){
  DN={};AV={};
  team=snap.docs.map(function(d){
    var x=d.data()||{};if(x.name&&typeof x.av==='string'&&x.av.indexOf('data:image/jpeg;base64,')===0&&x.av.length<40000)AV[slugName(String(x.name))]=x.av;if(x.dn&&x.name)DN[slugName(String(x.name))]=String(x.dn).slice(0,30);
    return{id:d.id,name:String(x.name||'Someone'),me:!!(who&&d.id==='n_'+nameHex(who.name)),known:+x.known||0,total:+x.total||0,sec:+x.sec||0,days:(x.tdays&&typeof x.tdays==='object')?x.tdays:{},last:+x.last||0,pts:+x.pts||0,rounds:+x.rounds||0,g2048:+x.g2048||0,dlog:(x.dlog&&typeof x.dlog==='object')?x.dlog:{},done:Array.isArray(x.done)?x.done.slice(0,400):[]};
  });
  refreshTeam();refreshBoard();refreshGate();refreshHome();refreshG4LB();
}

/* ---------- bets (friendly, optional money) ---------- */
var bets=[],betMsg='';
function h36(str){var h=5381;for(var i=0;i<str.length;i++)h=((h<<5)+h+str.charCodeAt(i))>>>0;return h.toString(36);}
function mkey(){var d=new Date();return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2);}
function betId(a,b){var x=[slugName(a),slugName(b)].sort();return 'b_'+mkey()+'_'+h36(x[0])+'_'+h36(x[1]);}
function offerText(kind,val){return kind==='money'?(Number(val).toLocaleString('en-US')+'₮'):String(val);}
function cleanOffer(kind,raw){
  raw=String(raw||'').trim();
  if(kind==='money'){var n=Math.round(+raw.replace(/[\s,₮]/g,''));return(n>=1&&n<=1e9)?String(n):null;}
  raw=raw.slice(0,60);return raw?raw:null;
}
function ptsOf(name){var k=slugName(name);for(var i=0;i<team.length;i++){if(slugName(team[i].name)===k)return team[i].pts||0;}return 0;}
function offerForm(prefix,btn,extra){
  return '<div class="betf"><select id="'+prefix+'K" aria-label="Type"><option value="other">Not money (a favor, a treat)</option><option value="money">Money (₮)</option></select>'+
    '<input id="'+prefix+'V" type="text" maxlength="60" placeholder="e.g. loser buys coffee" aria-label="Bet">'+(extra||'')+'<button class="btn" type="button" data-bet="'+btn+'">'+(btn==='create'?'Propose':'Counter')+'</button></div>';
}
function betsHTML(){
  var mk=mkey(),me=who?slugName(who.name):'';
  var list=bets.filter(function(b){return b.month===mk;});
  var rows=list.map(function(b){
    var cur=offerText(b.kind,b.val);
    var mine=me&&(slugName(b.a)===me||slugName(b.b)===me);
    var myTurn=me&&b.status==='open'&&slugName(b.turn)===me;
    var st=b.status==='agreed'?'<b class="bok">Agreed</b>':(myTurn?'<b>Your move</b>':'<small>Waiting for '+esc(b.turn)+'</small>');
    var hist=(b.hist||[]).map(function(h){return esc(offerText(h.kind,h.val))+' <small>('+esc(h.by)+')</small>';}).join(' → ');
    var act='';
    if(myTurn)act='<div class="betact"><button class="btn primary" type="button" data-bet="accept" data-id="'+esc(b.id)+'">Accept</button><details class="opt2"><summary>Make a counter offer</summary>'+offerForm('bc'+esc(b.id).replace(/[^a-z0-9_]/gi,''),'counter" data-id="'+esc(b.id))+'</details></div>';
    if(mine)act+='<button class="link" type="button" data-bet="cancel" data-id="'+esc(b.id)+'">Cancel bet</button>';
    return '<div class="betrow"><div class="bethead"><b>'+esc(b.a)+'</b> <small>('+ptsOf(b.a)+' pts)</small> <span>vs</span> <b>'+esc(b.b)+'</b> <small>('+ptsOf(b.b)+' pts)</small></div>'+
      '<div class="betcur">'+esc(cur)+'</div>'+st+(hist&&(b.hist||[]).length>1?'<div class="bethist">'+hist+'</div>':'')+act+'</div>';
  }).join('');
  var create='';
  if(!DB||!S.canWrite)create='<p class="hintline">To place bets, the site needs its Supabase settings.</p>';
  else if(!who)create='<p class="hintline">Enter your name to place a bet.</p>';
  else{
    var opp=team.filter(function(r){return slugName(r.name)!==me;});
    if(!opp.length)create='<p class="hintline">No one to bet with yet. Friends appear here once they enter and earn points.</p>';
    else create='<details class="opt2" id="betNew"><summary>+ New bet</summary><div class="betf"><select id="betOpp" aria-label="Opponent">'+opp.map(function(r){return '<option value="'+esc(r.name)+'">'+esc(r.name)+'</option>';}).join('')+'</select></div>'+offerForm('bn','create')+'</details>';
  }
  return '<div class="panel betbox"><h2>This month’s bets</h2>'+(rows||'<p>No bets this month.</p>')+create+(betMsg?'<p class="addmsg">'+esc(betMsg)+'</p>':'')+'<p class="hintline">Take turns raising or changing the stakes, auction-style. Once the other person accepts, the bet is on. Non-money bets are welcome.</p></div>';
}
function onBets(snap){
  bets=snap.docs.map(function(d){var x=d.data()||{};return{id:d.id,a:String(x.a||''),b:String(x.b||''),month:String(x.month||''),kind:x.kind==='money'?'money':'other',val:String(x.val||''),by:String(x.by||''),turn:String(x.turn||''),status:x.status==='agreed'?'agreed':'open',hist:Array.isArray(x.hist)?x.hist.slice(-12):[]};});
  var f=document.activeElement;if(f&&f.closest&&f.closest('.betbox')&&/INPUT|SELECT/.test(f.tagName))return;
  refreshBoard();refreshGate();refreshHome();
}
function betDo(el){
  var act=el.dataset.bet,id=el.dataset.id;
  if(!DB||!who)return;
  var me=who.name;
  function done(msg){betMsg=msg||'';refreshBoard();refreshGate();if(S.tab==='home'&&who){var ae=document.activeElement;if(ae&&ae.blur)ae.blur();refreshHome();}}
  if(act==='create'){
    var opp=$('#betOpp').value,kind=$('#bnK').value,val=cleanOffer(kind,$('#bnV').value);
    if(!val){betMsg=kind==='money'?'Enter the amount as a number.':'Describe the bet.';done(betMsg);return;}
    var did=betId(me,opp);
    DB.doc('bets/'+did).get().then(function(sn){
      if(sn&&sn.exists&&sn.exists!==false){var x=sn.data&&sn.data();if(x)return done('You already have a bet with them this month.');}
      var o={by:me,kind:kind,val:val,at:Date.now()};
      return DB.doc('bets/'+did).set({a:me,b:opp,month:mkey(),kind:kind,val:val,by:me,turn:opp,status:'open',hist:[o],at:Date.now()}).then(function(){done('Offer sent.');});
    }).catch(function(){done('Could not send. Please try again.');});
    return;
  }
  var b=bets.filter(function(x){return x.id===id;})[0];if(!b)return;
  if(act==='accept'){
    if(b.status!=='open'||slugName(b.turn)!==slugName(me))return;
    DB.doc('bets/'+id).update({status:'agreed',turn:''}).then(function(){done('Bet is on!');},function(){done('Something went wrong.');});
  }else if(act==='counter'){
    if(b.status!=='open'||slugName(b.turn)!==slugName(me))return;
    var key=id.replace(/[^a-z0-9_]/gi,''),kind2=$('#bc'+key+'K').value,v2=cleanOffer(kind2,$('#bc'+key+'V').value);
    if(!v2){betMsg='Please enter a valid offer.';done(betMsg);return;}
    var other=slugName(b.a)===slugName(me)?b.b:b.a;
    var hist=b.hist.concat([{by:me,kind:kind2,val:v2,at:Date.now()}]).slice(-12);
    DB.doc('bets/'+id).update({kind:kind2,val:v2,by:me,turn:other,hist:hist}).then(function(){done('Counter offer sent.');},function(){done('Something went wrong.');});
  }else if(act==='cancel'){
    DB.doc('bets/'+id).delete().then(function(){done('Bet cancelled.');},function(){done('Something went wrong.');});
  }
}
document.addEventListener('click',function(e){var t=e.target.closest&&e.target.closest('[data-bet]');if(t)betDo(t);});

}

  }).catch(function(){});
}

function applyPic(url){
  var b=$('#bgpic');
  if(url){b.style.backgroundImage='url("'+url+'")';b.classList.add('on');document.body.classList.add('haspic');$('#picDel').hidden=false;}
  else{b.style.backgroundImage='';b.classList.remove('on');document.body.classList.remove('haspic');$('#picDel').hidden=true;}
}
function picKey(){return (who&&!who.owner)?PKEY+':'+nameHex(who.name):PKEY;}
function loadPic(){var u=null;try{u=localStorage.getItem(picKey());}catch(e){}applyPic(u==='none'?null:(u||DEFAULT_PIC));}
function clearPic(){try{localStorage.setItem(picKey(),'none');}catch(e){}applyPic(null);$('#picMsg').textContent='';}
function setPic(file){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var sc=Math.min(1,1280/Math.max(img.width,img.height));
      var c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);
      var url=c.toDataURL('image/jpeg',0.82),saved=true;
      try{localStorage.setItem(picKey(),url);}catch(e){saved=false;}
      applyPic(url);
      $('#picMsg').textContent=saved?'Photo saved':'Photo could not be saved; showing it this time only';
    };
    img.onerror=function(){$('#picMsg').textContent='Could not read this image';};
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
document.addEventListener('change',function(e){if(e.target.id==='pic'&&e.target.files&&e.target.files[0]){setPic(e.target.files[0]);e.target.value='';}});

var GKEY='sat-holboos-2048',G={cells:[],score:0,best:0,over:false,won:false,keep:false,fresh:-1,merged:{}};
function saveGame(){if(!who)return;try{localStorage.setItem(sk(GKEY),JSON.stringify({cells:G.cells,score:G.score,best:G.best,over:G.over,won:G.won,keep:G.keep}));}catch(e){}}
function loadGameSRS(){loadSRS();}
function loadGame(){var g=loadJSON(GKEY,{});G={cells:Array.isArray(g.cells)&&g.cells.length===16?g.cells:[],score:+g.score||0,best:+g.best||0,over:!!g.over,won:!!g.won,keep:!!g.keep,fresh:-1,merged:{}};if(!G.cells.length)newGame(true);}
function addTile(){var e=[];G.cells.forEach(function(v,i){if(!v)e.push(i);});if(!e.length)return;var i=e[Math.floor(Math.random()*e.length)];G.cells[i]=Math.random()<.9?2:4;G.fresh=i;}
function newGame(silent){G.cells=[];for(var i=0;i<16;i++)G.cells.push(0);G.score=0;G.over=false;G.won=false;G.keep=false;G.merged={};addTile();addTile();G.fresh=-1;saveGame();if(!silent)drawGame();}
function canMove(){for(var i=0;i<16;i++){var v=G.cells[i];if(!v)return true;if(i%4<3&&G.cells[i+1]===v)return true;if(i<12&&G.cells[i+4]===v)return true;}return false;}
function move(dir){
  if(G.over||(G.won&&!G.keep))return;
  var moved=false,gain=0;G.merged={};G.fresh=-1;G.from={};
  for(var a=0;a<4;a++){
    var idx=[];for(var b=0;b<4;b++){var r,c;if(dir==='L'){r=a;c=b;}else if(dir==='R'){r=a;c=3-b;}else if(dir==='U'){r=b;c=a;}else{r=3-b;c=a;}idx.push(r*4+c);}
    var vals=idx.filter(function(i){return G.cells[i];}),out=[],mg=[],fr=[];
    for(var k=0;k<vals.length;k++){var v0=G.cells[vals[k]];if(k+1<vals.length&&v0===G.cells[vals[k+1]]){out.push(v0*2);gain+=v0*2;mg.push(out.length-1);fr.push(vals[k]);k++;}else{out.push(v0);fr.push(vals[k]);}}
    while(out.length<4)out.push(0);
    var old=idx.map(function(i){return G.cells[i];});idx.forEach(function(i,j){if(old[j]!==out[j])moved=true;G.cells[i]=out[j];if(out[j]&&fr[j]!==i)G.from[i]=fr[j];});
    mg.forEach(function(j){G.merged[idx[j]]=1;});
  }
  if(!moved)return;
  G.score+=gain;addTile();
  if(G.score>G.best){G.best=G.score;schedulePush();}
  if(!G.won&&G.cells.some(function(v){return v>=2048;})){G.won=true;try{confetti();}catch(e){}}
  if(!canMove())G.over=true;
  saveGame();drawGame(true);
  if(gain)try{if(navigator.vibrate)navigator.vibrate(10);}catch(e){}
}
function boardCells(){
  return G.cells.map(function(v,i){
    var c=v?' v'+(v>2048?'big':v)+(i===G.fresh?' nw':'')+(G.merged[i]?' mg':''):'';
    return '<div class="g4c"><div class="g4t'+c+'">'+(v||'')+'</div></div>';
  }).join('');
}
function g4Overlay(){
  if(G.over)return '<div class="g4o"><b>Game over</b><span>Score '+G.score+'</span><button class="btn primary" data-a="g4new">Try again</button></div>';
  if(G.won&&!G.keep)return '<div class="g4o win"><b>You made 2048!</b><span>Score '+G.score+'</span><div class="actions"><button class="btn" data-a="g4keep">Keep going</button><button class="btn primary" data-a="g4new">New game</button></div></div>';
  return '';
}
function g4LB(){
  var rows=team.map(function(r){return{name:r.name,me:r.me,v:r.g2048||0};});
  if(who&&!rows.some(function(r){return r.me;}))rows.push({name:who.name,me:true,v:G.best||0});
  rows.forEach(function(r){if(r.me)r.v=Math.max(r.v,G.best||0);});
  rows=rows.filter(function(r){return r.v>0||r.me;}).sort(function(a,b){return b.v-a.v;});
  return '<div class="panel"><h2 class="hic">'+ico('trophy')+'2048 leaderboard</h2>'+rows.map(function(r,i){var cls=(i<3&&r.v>0)?' r'+(i+1):'';return '<div class="lrow'+(r.me?' me':'')+'"><span class="lrank'+cls+'">'+(i+1)+'</span><div class="lname">'+esc(dname(r.name))+(r.me?' (me)':'')+'<small>best tile score</small></div><div class="lpts">'+r.v+'</div></div>';}).join('')+'</div>';
}
function gameHTML(){
  return '<div class="g4wrap"><div class="g4head"><div class="g4logo">2048</div><div class="g4sc"><span>Score</span><b id="g4s">'+G.score+'</b></div><div class="g4sc"><span>Best</span><b id="g4b">'+G.best+'</b></div></div>'+
    '<div class="g4bar"><p class="hintline">Swipe or use arrow keys. Join the numbers to reach <b>2048</b>!</p><button class="btn" data-a="g4new">New game</button></div>'+
    '<div class="g4" id="g4" tabindex="0" aria-label="2048 board">'+boardCells()+'<div id="g4ov">'+g4Overlay()+'</div></div></div><div id="g4lb">'+g4LB()+'</div>';
}
function drawGame(anim){
  var g=$('#g4');if(!g||S.tab!=='g2048')return;
  g.innerHTML=boardCells()+'<div id="g4ov">'+g4Overlay()+'</div>';
  $('#g4s').textContent=G.score;$('#g4b').textContent=G.best;
  if(anim){var cs=g.querySelectorAll('.g4c');if(cs.length>5){var w=cs[1].offsetLeft-cs[0].offsetLeft,h=cs[4].offsetTop-cs[0].offsetTop;
    for(var d in G.from){var s0=G.from[d],t=cs[d].firstChild;if(!t)continue;var dx=((s0%4)-(d%4))*w,dy=(Math.floor(s0/4)-Math.floor(d/4))*h;
      if(t.animate)t.animate([{transform:'translate('+dx+'px,'+dy+'px)'},{transform:'translate(0,0)'}],{duration:90,easing:'ease-out'});}}
    var sc=$('#g4s');sc.classList.remove('bump');void sc.offsetWidth;sc.classList.add('bump');}
}

function recStart(){

    var mr;try{mr=new MediaRecorder(st,mt?{mimeType:mt,audioBitsPerSecond:24000}:{});}catch(e){mr=new MediaRecorder(st);}
    REC={mr:mr,st:st,ch:[],t0:Date.now(),send:false};
    mr.ondataavailable=function(e){if(e.data&&e.data.size)REC.ch.push(e.data);};
    mr.onstop=function(){var r=REC;REC=null;r.st.getTracks().forEach(function(t){t.stop();});clearInterval(r.iv);$('#crec').hidden=true;$('#chatform').hidden=false;
      if(!r.send)return;var dur=Math.round((Date.now()-r.t0)/1000);if(dur<1){toastC('Hold on, too short');return;}
      var blob=new Blob(r.ch,{type:r.mr.mimeType||'audio/webm'});if(blob.size>700000){toastC('Voice message too long');return;}
      var fr=new FileReader();fr.onload=function(){voiceSend(String(fr.result),dur);};fr.readAsDataURL(blob);};

    $('#chatform').hidden=true;$('#crec').hidden=false;$('#rect').textContent='0:00';
    REC.iv=setInterval(function(){if(!REC)return;var s=Math.floor((Date.now()-REC.t0)/1000);$('#rect').textContent=Math.floor(s/60)+':'+('0'+s%60).slice(-2);if(s>=60)recStop(true);},250);
    try{if(navigator.vibrate)navigator.vibrate(20);}catch(e){}
  }).catch(function(){toastC('Microphone is blocked');});
}

}
function playPop(){

}
